name: POS demo checks

on:
  pull_request:
    branches: [main]
    paths:
      - "pos-demo/**"
      - ".github/workflows/pos-demo-tests.yml"
  push:
    branches: [main]
    paths:
      - "pos-demo/**"
      - ".github/workflows/pos-demo-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pos-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit and mobile browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pos-demo
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pnpm
        run: npm install --global pnpm@11.25.0

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run JavaScript unit tests
        run: pnpm test

      - name: Run synthetic catalog checks
        run: python -m unittest tests/test_demo_catalog.py -v

      - name: Run mobile UI tests
        run: pnpm test:ui

      - name: Write GitHub summary
        if: always()
        shell: bash
        run: |
          {
            echo "## POS Barbachu · demo pública"
            echo
            echo "- Datos utilizados: únicamente registros sintéticos marcados DEMO."
            echo "- Validaciones: lógica, catálogo, recorrido de venta móvil e inventario simulado."
            echo "- Captura móvil y reporte HTML: artifact **pos-demo-test-results**."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload mobile screenshot and Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pos-demo-test-results
          path: |
            pos-demo/test-results/
          if-no-files-found: warn
          retention-days: 14
