<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#102b27" />
    <meta name="description" content="Prototipo público POS Barbachu con información totalmente ficticia." />
    <title>POS Barbachu · Demo</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.mjs"></script>
  </head>
  <body>
    <div class="demo-ribbon" role="note">DEMO · DATOS FICTICIOS · NO USAR PARA VENTAS</div>
    <header class="topbar">
      <div class="brand-mark" aria-hidden="true">B</div>
      <div class="brand-copy"><p class="eyebrow">BARBACHU · PROTOTIPO</p><h1>POS Barbachu</h1></div>
      <button class="quiet-button" id="reset-demo" type="button">Reiniciar demo</button>
    </header>
    <main>
      <div class="intro"><div><p class="eyebrow">OPERACIÓN DE PRUEBA</p><h2 id="view-title">Nueva venta</h2></div><span class="demo-pill">LOCAL · DEMO</span></div>
      <nav class="tabs" aria-label="Secciones POS" role="tablist">
        <button type="button" role="tab" aria-selected="true" data-view="sale">Venta</button>
        <button type="button" role="tab" aria-selected="false" data-view="orders">Comandas <span id="order-count" class="count-badge">0</span></button>
        <button type="button" role="tab" aria-selected="false" data-view="cash">Caja</button>
        <button type="button" role="tab" aria-selected="false" data-view="stock">Inventario</button>
      </nav>
      <section id="app-view" aria-live="polite"></section>
    </main>
    <footer>Prototipo de evaluación · Los cambios se guardan solo en este navegador.</footer>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
